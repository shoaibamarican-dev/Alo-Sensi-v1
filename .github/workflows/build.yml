name: Build ALOO SENSI PRO APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path "*/build/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle nahi mili. Project files repo ke andar sahi jagah par nahi hain."
            exit 1
          fi
          PROJ_DIR=$(dirname "$SETTINGS")
          echo "Project folder: $PROJ_DIR"
          cd "$PROJ_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALOO-SENSI-PRO-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
